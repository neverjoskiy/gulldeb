[package]
name = "gulldeb"
version = "0.1.3"
edition = "2021"
authors = ["neverjoskiy"]
description = "Convert Debian .deb packages into Arch Linux .pkg.tar.zst packages"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
ar = "0.1"
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
zstd = "0.13"
tempfile = "3"
indicatif = "0.17"
chrono = "0.4"
anyhow = "1"

[[bin]]
name = "gulldeb"
path = "src/main.rs"
